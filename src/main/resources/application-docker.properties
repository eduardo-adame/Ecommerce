spring.datasource.url=jdbc:mysql://db:3306/ecommerce_bd?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&autoReconnect=true&connectTimeout=5000
spring.datasource.username=root
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false

spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.max-lifetime=60000
spring.datasource.hikari.validation-timeout=5000

spring.mvc.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
spring.mvc.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS