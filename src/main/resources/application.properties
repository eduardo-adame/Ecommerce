server.port=8080
spring.application.name=proyecto

spring.datasource.url=jdbc:mysql://localhost:3306/ecommerce_bd?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${MYSQL_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.mvc.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
spring.mvc.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS

app.jwt.secret=${JWT_SECRET:cambiar_en_produccion}
app.jwt.expiration-ms=86400000

stripe.api.key=${STRIPE_SECRET_KEY:cambiar_en_produccion}
